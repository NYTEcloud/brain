[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telonyte-brain-langchain"
version = "2.2.7"
description = "LangChain retriever adapter for B.R.A.I.N. V1."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
dependencies = [
  "telonyte-brain>=2.2.7",
  "langchain-core>=0.3",
]

[project.urls]
Homepage = "https://brain.telonyte.com"
Documentation = "https://brain.telonyte.com/setup/api"
Source = "https://github.com/Telonyte/brain"

[tool.setuptools.packages.find]
where = ["src"]
