[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telonyte-brain-llamaindex"
version = "2.2.7"
description = "LlamaIndex retriever adapter for B.R.A.I.N. V1."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
dependencies = [
  "telonyte-brain>=2.2.7",
  "llama-index-core>=0.10",
]

[project.urls]
Homepage = "https://brain.telonyte.com"
Documentation = "https://brain.telonyte.com/setup/api"
Source = "https://github.com/NYTEcloud/brain"

[tool.setuptools.packages.find]
where = ["src"]
